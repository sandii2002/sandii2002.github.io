/* =====================================================================
   GP2 Virtual Labs — "lab notebook" design system
   Pad (engineering paper) · Ink (blue-black) · one Highlighter accent
   ===================================================================== */
:root{
  --pad:#E9EFE6; --sheet:#FAFCF8; --bench:#F1F5EE; --rule:#C9D6C4; --rule-2:#AFC0A9;
  --ink:#1B2838; --ink-2:#53606F; --ink-3:#7C8794;
  --hl:#F6E04B; --hl-soft:rgba(246,224,75,.55);
  --red:#B3261E; --red-soft:#F7E3E0;
  --lcd:#101914; --lcd-ink:#A6F59A;
  /* Type system. Themes (html[data-font-theme]) only swap these variables. */
  --font-ui:"Inter Variable",Inter,"Segoe UI",system-ui,sans-serif;          /* body, controls */
  --font-head:"Space Grotesk Variable","Space Grotesk","Inter Variable",system-ui,sans-serif; /* headings */
  --font-read:var(--font-ui);                                                /* long-form instructions & theory */
  --font-data:"Atkinson Hyperlegible Mono",ui-monospace,Menlo,Consolas,monospace; /* readouts, tables, equations */
  --font-num:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",Verdana,sans-serif; /* big lab numbers & letters */
  --fs-scale:1;                                                              /* text size: .9 / 1 / 1.15 / 1.3 */
  --font:var(--font-ui); --mono:var(--font-data);
  --r-sheet:3px; --r-btn:6px; --r-inst:8px;
  --rail:248px;
}
*{box-sizing:border-box}
html{font-size:calc(100% * var(--fs-scale))}
html[data-font-theme="academic"]{--font-read:"Merriweather Variable",Merriweather,Georgia,"Times New Roman",serif;--font-head:var(--font-read)}
html[data-font-theme="dyslexia"]{--font-ui:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",Verdana,sans-serif;--font-head:var(--font-ui);--font-data:"Atkinson Hyperlegible Mono",ui-monospace,Menlo,monospace}
html[data-font-theme="dyslexia"] body{letter-spacing:.012em;word-spacing:.06em;line-height:1.6}
html[data-font-theme="academic"] .part p,html[data-font-theme="academic"] .checklist .st{line-height:1.65}
/* headings */
h1,h2,h3,h4,.brand b,.labrow-title,.cover-name input{font-family:var(--font-head)}
.labhead-num,.labrow-num,.resume-num,.rail-num,.partletter{font-family:var(--font-num)}
/* reading text */
.part p,.checklist .st,details.bg>div,.brief li,.note,.qt,.howto li,.labhead p{font-family:var(--font-read)}
/* data: readouts, tables, inputs, equations, timers — tabular figures so digits line up and never jitter */
.lcd,.lcd>span,code,.eq,table.data td input,table.data td.calc,.plotbox .fitres,.kv b,.ctl .lab b,.rp-count,input[type=number],.sendstats b,.checklist .sn{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.lcd small{font-variant-numeric:normal}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);font-size:1rem;line-height:1.5;color:var(--ink);
  background-color:var(--pad);
  background-image:
    linear-gradient(rgba(27,40,56,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(27,40,56,.07) 1px,transparent 1px),
    linear-gradient(rgba(27,40,56,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(27,40,56,.035) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px;
  font-variant-numeric:lining-nums;
}
a{color:var(--ink);text-decoration-thickness:1px;text-underline-offset:3px}
h1,h2,h3,h4{line-height:1.15;margin:0 0 .5em;font-weight:700;letter-spacing:-.015em}
h1{font-size:2.125rem} h2{font-size:1.625rem} h3{font-size:1.25rem} h4{font-size:1rem}
p{margin:.35em 0 .8em;max-width:72ch}
button,select,input,textarea{font:inherit;color:inherit}
code{font-family:var(--mono);font-size:.9em;background:var(--bench);padding:1px 5px;border-radius:3px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 6px var(--hl)}
.muted{color:var(--ink-2)} .small{font-size:0.875rem} .tiny{font-size:0.7812rem}
.hidden{display:none !important}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
.done{color:var(--ink);font-weight:700}

/* ---------- highlighter: the one accent ---------- */
.hl{background-image:linear-gradient(100deg,transparent .6%,var(--hl) 1.6%,var(--hl-soft) 96%,transparent 98.5%);background-repeat:no-repeat;background-size:100% 78%;background-position:0 62%}
@keyframes swipe{from{background-size:0% 78%}to{background-size:100% 78%}}
.hl.swipe{animation:swipe .55s cubic-bezier(.2,.7,.2,1) .15s both}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;padding:0 24px;height:3.5rem;background:var(--sheet);border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;white-space:nowrap}
.brand b{font-size:1.1875rem;font-weight:800;letter-spacing:-.02em}
.brand span{font-size:0.875rem;color:var(--ink-2)}
.topbar .spacer{flex:1}
.who{display:flex;gap:14px;font-size:0.875rem;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.who b{color:var(--ink);font-weight:700}
.saved{font-size:0.8125rem;color:var(--ink-2);opacity:0;transition:opacity .3s}
.saved.show{opacity:1}

/* ---------- generic sheet ---------- */
.sheet,.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-sheet);padding:22px 24px;margin:0 0 18px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 60px}

/* ---------- buttons & controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:7px 15px;border-radius:var(--r-btn);border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);font-weight:700;font-size:0.9375rem;line-height:1.2;cursor:pointer;text-decoration:none;transition:background-color .12s,transform .35s cubic-bezier(.34,1.56,.64,1)}
.btn:hover{background:#2C3D52}
.btn:not(:disabled):hover{transform:translateY(-1.5px)}
.btn:not(:disabled):active{transform:translateY(.5px) scale(.965);transition-duration:.07s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:var(--sheet);color:var(--ink)}
.btn.sec:hover{background:var(--bench)}
.btn.teal{background:var(--ink);color:var(--sheet)}
.btn.warn{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding-left:6px;padding-right:6px}
.btn.ghost:hover{background:rgba(27,40,56,.06)}
.btn.sm{min-height:32px;padding:5px 11px;font-size:0.875rem}
.btn.on{box-shadow:0 0 0 4px var(--hl)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:0.875rem;color:var(--ink-2);font-weight:600}
input[type=text],input[type=email],input[type=number],input[type=password],select,textarea{border:1.5px solid var(--rule-2);border-radius:4px;padding:8px 10px;background:#fff;color:var(--ink);min-height:38px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px var(--hl-soft)}
textarea{width:100%;min-height:96px;resize:vertical;line-height:1.5}
input[type=range]{accent-color:var(--ink);width:100%}
input[type=checkbox]{accent-color:var(--ink);width:17px;height:17px}
.chk{display:flex;align-items:center;gap:7px;font-size:0.9375rem;cursor:pointer}
.ctl{display:flex;flex-direction:column;gap:3px;min-width:170px;flex:1}
.ctl .lab{display:flex;justify-content:space-between;gap:8px;font-size:0.875rem;color:var(--ink-2)}
.ctl .lab b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:var(--r-btn);overflow:hidden;background:var(--sheet)}
.seg button{background:transparent;border:0;border-right:1px solid var(--rule-2);padding:7px 12px;cursor:pointer;font-size:0.875rem;font-weight:600;color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--bench)}
.seg button{transition:background-color .12s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.seg button:active{transform:scale(.95);transition-duration:.07s}
.seg button.on{background:var(--ink);color:var(--sheet)}
.lcd{font-family:var(--mono);background:var(--lcd);color:var(--lcd-ink);border-radius:var(--r-inst);padding:7px 14px 9px;font-size:1.375rem;line-height:1.15;min-width:136px;text-align:right;box-shadow:inset 0 0 0 1px #000,inset 0 2px 10px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
.lcd small{display:block;text-align:left;font-family:var(--font);font-size:0.7188rem;color:#86C27C;letter-spacing:0;margin-bottom:2px}
.eq{font-size:1.0625rem;background:var(--bench);border-left:3px solid var(--ink);padding:5px 12px;display:inline-block;margin:4px 0}
.note{background:var(--bench);border-left:4px solid var(--ink-2);padding:9px 14px;border-radius:0 4px 4px 0;margin:10px 0;font-size:0.9375rem;max-width:none}
.note.warn{background:var(--red-soft);border-left-color:var(--red);color:#5E1712}
.note.ok{border-left-color:var(--ink)}
.kv{display:grid;grid-template-columns:auto auto;justify-content:start;gap:4px 18px;font-size:0.9375rem}
.kv b{font-variant-numeric:tabular-nums}

/* ---------- home ---------- */
.home{max-width:1180px;margin:0 auto;padding:34px 24px 70px}
.home-top{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;margin-bottom:34px}
@media (max-width:900px){.home-top{grid-template-columns:1fr}}
.cover{position:relative;padding-left:46px}
.cover:before{content:"";position:absolute;left:0;top:-1px;bottom:-1px;width:22px;background:var(--ink);border-radius:var(--r-sheet) 0 0 var(--r-sheet)}
.cover-name{display:block;font-size:0.9375rem;color:var(--ink-2);font-weight:600}
.cover-name input{display:block;width:100%;border:0;border-bottom:2px solid var(--ink);border-radius:0;background:transparent;font-size:2.125rem;font-weight:750;letter-spacing:-.01em;padding:4px 0 6px;margin-top:2px;min-height:auto;box-shadow:none}
.cover-name input:focus{box-shadow:none;background:linear-gradient(transparent 55%,var(--hl-soft) 55%)}
.cover-fields{display:grid;grid-template-columns:1fr 110px;gap:14px;margin:18px 0 16px}
@media (max-width:560px){.cover-fields{grid-template-columns:1fr 1fr}}
.cover-foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cover-foot p{margin:0;font-size:0.875rem;color:var(--ink-2);flex:1;min-width:220px}
.resume h2,.howto h2{font-size:0.9375rem;font-weight:600;color:var(--ink-2);letter-spacing:0;margin:0 0 6px}
.resume-title{display:flex;align-items:baseline;gap:14px;margin:4px 0 6px}
.resume-num{font-size:4rem;font-weight:200;line-height:.9;letter-spacing:-.04em}
.resume-name{font-size:1.5rem;font-weight:750;line-height:1.15}
.resume-meta{font-size:0.875rem;color:var(--ink-2);margin-bottom:16px}
.howto ol{margin:6px 0 0;padding-left:1.3em}
.howto li{margin:6px 0}
.lablist-h{font-size:1.375rem;margin:0 0 4px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.lablist-h span{font-size:0.875rem;font-weight:400;color:var(--ink-2)}
.lablist{list-style:none;margin:0 0 30px;padding:0;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-sheet)}
.lablist li+li{border-top:1px solid var(--rule)}
.labrow{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:18px;padding:14px 22px 14px 14px;text-decoration:none;color:var(--ink)}
.labrow:hover{background:var(--bench)}
.labrow{transition:background-color .15s,transform .35s cubic-bezier(.34,1.56,.64,1)}
.labrow:active{transform:scale(.985);transition-duration:.08s}
.labrow-num{transition:transform .45s cubic-bezier(.34,1.56,.64,1);transform-origin:100% 60%}
.labrow:hover .labrow-num{transform:translateX(-5px) scale(1.07)}
.saved{display:inline-block}
.lcd>span{display:inline-block}
.checklist input{transition:background-color .15s}
@media print{.part,.part *{opacity:1 !important;transform:none !important}}
.labrow:hover .labrow-title{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}
.labrow-num{font-size:3.5rem;font-weight:200;line-height:.95;text-align:right;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.labrow-title{display:block;font-size:1.1875rem;font-weight:750;line-height:1.25}
.labrow-desc{display:block;font-size:0.9062rem;color:var(--ink-2);margin-top:2px;max-width:70ch}
.labrow-status{font-size:0.875rem;color:var(--ink-3);white-space:nowrap}
.labrow-status.prog{color:var(--ink);font-weight:700}
.labrow-status.sent{color:var(--ink);font-weight:700}
.labrow-status.sent:before{content:"";display:inline-block;width:1.1em;height:1.1em;margin-right:.2em;vertical-align:-.22em;background:currentColor;-webkit-mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%20-960%20960%20960%22%3E%3Cpath%20d%3D%22m378-332%20363-363q9-9%2021.5-9t21.5%209q9%209%209%2021.5t-9%2021.5L399-267q-9%209-21%209t-21-9L175-449q-9-9-8.5-21.5T176-492q9-9%2021.5-9t21.5%209l159%20160Z%22%2F%3E%3C%2Fsvg%3E") center/contain no-repeat;mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%20-960%20960%20960%22%3E%3Cpath%20d%3D%22m378-332%20363-363q9-9%2021.5-9t21.5%209q9%209%209%2021.5t-9%2021.5L399-267q-9%209-21%209t-21-9L175-449q-9-9-8.5-21.5T176-492q9-9%2021.5-9t21.5%209l159%20160Z%22%2F%3E%3C%2Fsvg%3E") center/contain no-repeat}
.ico{width:1.2em;height:1.2em;fill:currentColor;vertical-align:-.25em;flex:none}
.seg button .ico{margin-right:.3em}
.parthead h2 .ico{width:1.05em;height:1.05em;margin-right:.3em;vertical-align:-.13em}
.lablist.extra .labrow{grid-template-columns:1fr auto;padding-left:22px}
@keyframes inkIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (max-width:640px){.labrow{grid-template-columns:52px 1fr;gap:12px;padding:12px 14px 12px 8px}.labrow-num{font-size:2.375rem}.labrow-status{grid-column:2;margin-top:-6px}.lablist.extra .labrow{grid-template-columns:1fr}.lablist.extra .labrow-status{grid-column:1}}
.homefoot{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;font-size:0.875rem;color:var(--ink-2);border-top:2px solid var(--ink);padding-top:14px}
.homefoot p{margin:0;max-width:78ch}
.homefoot a{color:var(--ink-3);font-size:0.8125rem}

/* ---------- lab page shell ---------- */
.labshell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);gap:30px;max-width:1600px;margin:0 auto;padding:26px 24px 80px}
.rail{position:sticky;top:4.75rem;align-self:start;max-height:calc(100vh - 5.75rem);overflow:auto;padding:2px 4px 8px 0;scrollbar-width:thin}
.rail-back{display:inline-block;font-size:0.875rem;margin-bottom:14px}
.rail-lab{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;margin-bottom:16px}
.rail-num{font-size:2.75rem;font-weight:200;line-height:.85;letter-spacing:-.04em}
.rail-title{font-size:1rem;font-weight:750;line-height:1.25}
.rail-parts{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.rail-parts li{border-bottom:1px solid var(--rule)}
.rail-parts a{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:baseline;padding:8px 4px 8px 2px;text-decoration:none;color:var(--ink);font-size:0.9062rem;line-height:1.3}
.rail-parts a:hover{background:rgba(27,40,56,.05)}
.rp-tag{font-weight:800;text-align:center}
.rp-count{font-size:0.8125rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rp-count.full{color:var(--ink);font-weight:700}
.rail-parts a.on .rp-name{background-image:linear-gradient(100deg,transparent .6%,var(--hl) 1.6%,var(--hl-soft) 96%,transparent 98.5%);background-repeat:no-repeat;background-size:100% 80%;background-position:0 60%}
.rail-foot{margin-top:16px}
.meter{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-bottom:6px}
.meter i{display:block;height:100%;width:100%;background:var(--ink);border-radius:3px;transform-origin:0 50%;transform:scaleX(0);transition:transform .7s cubic-bezier(.22,1,.36,1)}
.rail-foot .small{display:block;margin-bottom:10px}
.rail-foot .btn{width:100%}
.labmain{min-width:0}
.labhead{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:end;margin:0 0 18px}
.labhead-num{font-size:6rem;font-weight:200;line-height:.78;letter-spacing:-.05em}
.labhead h1{font-size:2.375rem;margin:0 0 4px;max-width:24ch}
.labhead p{margin:0;color:var(--ink-2)}
.brief{display:grid;grid-template-columns:1.2fr 1fr;gap:28px}
.brief h3{font-size:0.9375rem;margin:0 0 6px}
.brief ul{margin:0;padding-left:1.15em}
.brief li{margin:3px 0}
.brief .equip{font-size:0.9375rem;color:var(--ink-2);margin:0}
@media (max-width:900px){.brief{grid-template-columns:1fr;gap:12px}}
details.bg{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-sheet);padding:12px 24px;margin:0 0 22px}
details.bg summary{cursor:pointer;font-weight:700;padding:2px 0}
details.bg[open] summary{margin-bottom:8px}
details.bg ul{padding-left:1.2em}
.part{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-sheet);padding:22px 26px 26px;margin:0 0 22px;scroll-margin-top:4.5rem}
.parthead{display:grid;grid-template-columns:auto 1fr;align-items:end;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:16px}
.partletter{font-size:4.5rem;font-weight:200;line-height:.75;letter-spacing:-.04em;min-width:.6em}
.parthead h2{margin:0;font-size:1.625rem}
.parthead.plain{grid-template-columns:1fr}

/* procedure checklist */
.checklist{list-style:none;margin:6px 0 16px;padding:0;counter-reset:step;max-width:78ch}
.checklist li{counter-increment:step;margin:0}
.checklist label{display:grid;grid-template-columns:26px 1.6em 1fr;gap:4px;align-items:start;padding:7px 8px 7px 4px;border-radius:4px;cursor:pointer;line-height:1.45}
.checklist label:hover{background:rgba(27,40,56,.04)}
.checklist input{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:2px 0 0;border:2px solid var(--ink);border-radius:3px;background:#fff;display:grid;place-content:center;cursor:pointer}
.checklist input:checked{background:var(--ink)}
.checklist input:checked:after{content:"";width:6px;height:11px;border:solid var(--sheet);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.checklist .sn{font-weight:800;font-variant-numeric:tabular-nums}
.checklist .sn:before{content:counter(step) "."}
.checklist li.done .st{color:var(--ink-2)}
.checklist li.now .st{background-image:linear-gradient(100deg,transparent .4%,var(--hl) 1.2%,var(--hl-soft) 97%,transparent 99%);background-repeat:no-repeat;background-size:100% 100%;box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 3px}
.checklist li.now.swipe .st{animation:swipe2 .6s cubic-bezier(.2,.7,.2,1) .2s both}
@keyframes swipe2{from{background-size:0% 100%}to{background-size:100% 100%}}
.workrow{display:block}
@media (min-width:1400px){
  .workrow{display:grid;grid-template-columns:minmax(250px,310px) minmax(0,1fr);gap:22px;align-items:start}
  .workrow .checklist{position:sticky;top:4.75rem;margin-top:10px;font-size:0.9375rem}
}

/* bench (simulation container) */
.sim{background:var(--bench);border:1px solid var(--rule);border-radius:var(--r-inst);padding:14px;margin:12px 0 18px}
.simstage{position:relative;width:100%;border-radius:6px;overflow:hidden;background:#0d1310}
.simstage.light{background:#fbfcfa;border:1px solid var(--rule)}
.simstage canvas{display:block;width:100%;height:auto;touch-action:none}
.controls{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;margin-top:12px}

/* notebook: tables, plots, questions */
.tblblock{margin:14px 0 6px}
.tbltitle{font-weight:750;font-size:1rem;margin:16px 0 4px}
.tblwrap{overflow-x:auto;margin:6px 0 6px}
table.data{border-collapse:collapse;width:100%;font-size:0.9062rem;background:#fff}
table.data th{background:var(--sheet);font-weight:700;font-size:0.8438rem;text-align:center;padding:7px 8px;border:1px solid var(--rule);border-bottom:2px solid var(--ink);vertical-align:bottom}
table.data td{border:1px solid var(--rule);padding:3px 5px;text-align:center;vertical-align:middle}
table.data td.rl{font-weight:600;background:var(--sheet);white-space:nowrap;text-align:left;padding-left:10px}
table.data td input{width:100%;min-width:66px;min-height:32px;border:1px solid transparent;border-radius:3px;padding:4px 6px;text-align:center;background:transparent;font-variant-numeric:tabular-nums}
table.data td input:hover{border-color:var(--rule-2)}
table.data td input:focus{background:#fff;border-color:var(--ink);box-shadow:0 0 0 3px var(--hl-soft)}
table.data td select{min-height:32px;padding:3px 6px}
table.data td.calc{color:var(--ink-2);font-variant-numeric:tabular-nums;background:var(--bench);font-size:0.875rem}
table.data td.x{width:30px}
table.data td.x button{border:none;background:none;color:var(--ink-3);cursor:pointer;font-size:1.125rem;line-height:1}
table.data td.x button:hover{color:var(--red)}
.tblbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.plotbox{background:#fff;border:1px solid var(--rule);border-radius:var(--r-sheet);padding:12px 14px;margin:14px 0}
.plotbox canvas{width:100%;height:auto;display:block}
.plotbox .fitres{font-variant-numeric:tabular-nums;font-size:0.875rem;background:var(--bench);border-left:3px solid var(--ink);padding:7px 12px;margin-top:8px;white-space:pre-wrap}
.q{margin:16px 0 20px}
.q .qt{font-weight:600;margin-bottom:7px;max-width:78ch;line-height:1.45}
.q .qt .qn{font-weight:800;margin-right:6px}
.q .fig{margin:6px 0 8px}
.sketch{border:1px solid var(--rule-2);border-radius:4px;overflow:hidden;background:#fff}
.sketch canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.sketchbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid var(--sheet);box-shadow:0 0 0 1px var(--ink-3);cursor:pointer}
.swatch.on{box-shadow:0 0 0 2px var(--ink),0 0 0 5px var(--hl)}

/* send section & dialog */
.sendbox{border-top:4px solid var(--ink)}
.sendstats{display:flex;gap:28px;flex-wrap:wrap;margin:8px 0 16px}
.sendstats div{font-size:0.875rem;color:var(--ink-2)}
.sendstats b{display:block;font-size:1.875rem;font-weight:300;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;background:rgba(27,40,56,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px;overflow:auto}
.modal .box{background:var(--sheet);border:1px solid var(--ink);border-radius:var(--r-sheet);max-width:860px;width:100%;padding:24px 26px;box-shadow:8px 8px 0 rgba(27,40,56,.18)}
.sendgrid{display:grid;grid-template-columns:230px 1fr;gap:24px;margin-top:6px}
@media (max-width:720px){.sendgrid{grid-template-columns:1fr}}
.prelist{list-style:none;padding:0;margin:6px 0 0;font-size:0.9062rem}
.prelist li{display:grid;grid-template-columns:20px 1fr;gap:6px;margin:5px 0}
.prelist li.miss{color:var(--red)}
.stepbox{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;border-top:1px solid var(--rule);padding:14px 0}
.stepbox:first-child{border-top:0;padding-top:4px}
.stepbox .n{font-size:1.875rem;font-weight:200;line-height:.9;text-align:right}
.stepbox b{font-size:1.0312rem}
.reportpreview{max-height:320px;overflow:auto;border:1px solid var(--rule);border-radius:4px;padding:12px;font-size:0.8125rem;background:#fff}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 18px;border-radius:var(--r-btn);z-index:200;font-size:0.9375rem;box-shadow:4px 4px 0 rgba(27,40,56,.2);max-width:min(92vw,560px)}

/* phone / narrow: rail becomes bars */
.labbar,.sendbar{display:none}
@media (max-width:1000px){
  .labshell{grid-template-columns:1fr;padding:14px 12px 96px;gap:0}
  .rail{display:none}
  .labbar{display:flex;position:sticky;top:3.5rem;z-index:45;gap:10px;align-items:center;background:var(--sheet);border-bottom:1px solid var(--rule);padding:8px 12px;margin:0 -12px 14px}
  .labbar select{flex:1;min-width:0}
  .sendbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;gap:12px;align-items:center;justify-content:space-between;background:var(--sheet);border-top:2px solid var(--ink);padding:10px 14px}
  .labhead-num{font-size:4rem}
  .labhead h1{font-size:1.75rem}
  .partletter{font-size:3.25rem}
  .parthead h2{font-size:1.375rem}
  .part{padding:16px 14px 18px}
}
@media (max-width:600px){
  .topbar{padding:0 12px;gap:10px}.brand span,.who span{display:none}
  .home{padding:18px 12px 60px}
  .sheet,.card{padding:16px}
  .cover{padding-left:34px}.cover:before{width:14px}
  .cover-name input{font-size:1.625rem}
  .sim{padding:8px}
  .lcd{font-size:1.125rem;min-width:108px}
  h1{font-size:1.75rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
#printArea{display:none}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{display:block;position:absolute;left:0;top:0;width:100%}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.labhead.plain{grid-template-columns:1fr}
.note:empty{display:none}
.home-top>*,.cover-fields>*,.labmain,.brief>*{min-width:0}
.cover-fields input{width:100%}
label.f input,label.f select{width:100%;min-width:0}
@media (max-width:1000px){.part,details.bg,.brief{scroll-margin-top:7.375rem}}

/* Display & font settings menu */
.dispbtn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--rule-2);background:var(--sheet);color:var(--ink);border-radius:var(--r-btn);padding:4px 10px;font-weight:600;font-size:.875rem;min-height:2.125rem;cursor:pointer;transition:background-color .12s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.dispbtn:hover{background:var(--bench)}
.dispbtn:active{transform:scale(.95);transition-duration:.07s}
.dispbtn[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.dispmenu{position:fixed;z-index:210;width:min(22rem,calc(100vw - 16px));max-height:calc(100vh - 5rem);overflow:auto;background:var(--sheet);border:1px solid var(--ink);border-radius:var(--r-sheet);box-shadow:8px 8px 0 rgba(27,40,56,.18);padding:16px 16px 10px}
.dispmenu h3{font-size:1.05rem;margin:0 0 12px}
.dgroup{display:grid;gap:6px;margin-bottom:14px}
.dlabel{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.dchoice{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:1px;border:1.5px solid var(--rule-2);background:#fff;color:var(--ink);border-radius:var(--r-btn);padding:7px 11px;cursor:pointer;font-size:1rem;transition:border-color .12s,background-color .12s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.dchoice small{font-size:.78rem;color:var(--ink-2)}
.dchoice:hover{border-color:var(--ink)}
.dchoice:active{transform:scale(.97);transition-duration:.07s}
.dchoice.on{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.dchoice.on small{color:rgba(255,255,255,.78)}
.dsizes{grid-template-columns:repeat(4,1fr)}
.dsizes .dlabel{grid-column:1/-1}
.dsizes .dchoice{align-items:center;justify-content:center;min-height:2.6rem;font-family:var(--font-head)}
.dispmenu .dfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--rule);padding-top:8px}
@media (max-width:600px){.dispbtn-l{display:none}}
@media print{.dispbtn,.dispmenu{display:none !important}}
</style>

/* ---------------- axis ticks ---------------- */

/* ---------------- Laplace solver (shared by electrostatics labs) ----------------
   fixed: Float32Array (NaN = free cell, number = fixed potential)
   edge: 'neumann' (insulating paper edge) or 'zero' (grounded far boundary) */
function laplace(nx, ny, fixed, opt = {}) {
  const V = new Float32Array(nx * ny), it = opt.iters || 700, w = opt.omega || 1.92, neu = (opt.edge || 'neumann') === 'neumann';
  for (let i = 0; i < V.length; i++) V[i] = isNaN(fixed[i]) ? (opt.init || 0) : fixed[i];
  for (let k = 0; k < it; k++) {
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
      const id = j * nx + i; if (!isNaN(fixed[id])) continue;
      const l = i > 0 ? V[id - 1] : (neu ? V[id + 1] : 0), r = i < nx - 1 ? V[id + 1] : (neu ? V[id - 1] : 0);
      const u = j > 0 ? V[id - nx] : (neu ? V[id + nx] : 0), d = j < ny - 1 ? V[id + nx] : (neu ? V[id - nx] : 0);
      V[id] += w * ((l + r + u + d) / 4 - V[id]);
    }
  }
  return V;
}

}

// Decrypts the instructor-key functions. A wrong passphrase fails AES-GCM authentication.
async function openVault(pw) {

  const code = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(V.iv) }, k, b(V.ct)));
  if (!window.__GP2KEYS) { const s = document.createElement('script'); s.textContent = code; document.head.appendChild(s); }
  if (!window.__GP2KEYS) throw new Error('vault script did not run');
  return window.__GP2KEYS;
}
function renderKey() {

    };
